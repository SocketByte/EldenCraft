name: Windows build

on:
  push:
    # Version tags build once, through the Release workflow.
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          architecture: x64
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.13'
      - name: Set up development dependencies
        shell: pwsh
        run: |
          ./scripts/eldencraft.ps1 setup
          ./scripts/eldencraft.ps1 setup-native
      - name: Build, test and package
        shell: pwsh
        run: ./scripts/build-release.ps1
      - name: Upload Windows release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: EldenCraft-windows-x64
          path: |
            .local/releases/*.zip
            .local/releases/*.zip.sha256
          include-hidden-files: true
          if-no-files-found: error
