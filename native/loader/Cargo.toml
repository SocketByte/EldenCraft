[package]
name = "eldencraft-loader"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Persistent host for the hot-reloadable core. Keeps the DLL name the launcher,
# me3 profile and ReShade add-on already use.
[lib]
name = "eldencraft_native"
crate-type = ["cdylib", "rlib"]

[target.'cfg(windows)'.dependencies]
# Same SDK revision as the core; see native/Cargo.toml.
eldenring = { git = "https://github.com/Dasaav-dsv/fromsoftware-rs", rev = "5baf0dd2243e2affa8bc436d27d7305c2eab9490" }
fromsoftware-shared = { git = "https://github.com/Dasaav-dsv/fromsoftware-rs", rev = "5baf0dd2243e2affa8bc436d27d7305c2eab9490" }
