[package]
name = "eldencraft-native"
version = "0.5.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]
# loader: eldencraft_native.dll, the persistent hot-reload host of this core.
members = ["loader"]

[lib]
name = "eldencraft_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
# float_roundtrip: Minecraft echoes cumulative guard damage; the default
# parser can return a value 1 ULP above what native published.
serde_json = { version = "1", features = ["float_roundtrip"] }

[target.'cfg(windows)'.dependencies]
# Upstream 09a4208 (1.17.2 RVAs) plus the 1.17.2 WorldChrMan layout fix from
# vswarte/fromsoftware-rs PR 329, not merged yet. Return to upstream once it is.
eldenring = { git = "https://github.com/Dasaav-dsv/fromsoftware-rs", rev = "5baf0dd2243e2affa8bc436d27d7305c2eab9490" }
fromsoftware-shared = { git = "https://github.com/Dasaav-dsv/fromsoftware-rs", rev = "5baf0dd2243e2affa8bc436d27d7305c2eab9490" }
pelite = "0.10"
sha2 = "0.10"
ilhook = { version = "=2.3.0", default-features = false, features = ["x64"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
