[project]
name = "eldencraft"
version = "0.24.0"
description = "Offline Elden Ring and Minecraft integration with local development tools."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pillow>=10"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests", "passthrough"]
