conformanceSuites.each { taskName, suite ->
    tasks.register(taskName, JavaExec) {
        description = suite[1]
        group = 'verification'
        dependsOn testClasses
        classpath = sourceSets.test.runtimeClasspath
        mainClass = suite[0]
        if (taskName == 'hostStateConformance') jvmArgs '--enable-native-access=ALL-UNNAMED'
    }
    check.dependsOn taskName
}

// This project uses the integration executable above instead of a JUnit engine.
tasks.named('test') { enabled = false }
